# QSP self-hosting example: PostgreSQL + auth + signaling + web behind one nginx origin.
# Configure via .env (see .env.example). Start with: docker compose up -d

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qsp
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qsp"]
      interval: 3s
      timeout: 3s
      retries: 20

  auth:
    image: f4fez/qsp-authentication-server:${QSP_AUTH_VERSION:-0.1.1}
    depends_on:
      db: { condition: service_healthy }
    environment:
      # Single shared database; own Liquibase tracking tables (changeset ids collide otherwise).
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/qsp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_LIQUIBASE_DATABASE_CHANGE_LOG_TABLE: auth_databasechangelog
      SPRING_LIQUIBASE_DATABASE_CHANGE_LOG_LOCK_TABLE: auth_databasechangeloglock
      # Public issuer (the proxy strips the /auth prefix before the request reaches the app).
      SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_ISSUER: http://${QSP_HOST}:${QSP_PORT}/auth
      # Must equal the web client's redirect page exactly; also drives CORS allowed origins.
      QSP_AUTHORIZATION_CLIENTS_PORTAL_REDIRECT-URI_0: http://${QSP_HOST}:${QSP_PORT}/login-redirect.html

  signaling:
    image: f4fez/qsp-signaling-server:${QSP_SIGNALING_VERSION:-0.1.1}
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_started }
    environment:
      # Liquibase uses JDBC; the service itself uses R2DBC. Own tracking tables (changeset ids collide otherwise).
      SPRING_LIQUIBASE_URL: jdbc:postgresql://db:5432/qsp
      SPRING_LIQUIBASE_USER: postgres
      SPRING_LIQUIBASE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_LIQUIBASE_DATABASE_CHANGE_LOG_TABLE: signaling_databasechangelog
      SPRING_LIQUIBASE_DATABASE_CHANGE_LOG_LOCK_TABLE: signaling_databasechangeloglock
      SPRING_R2DBC_URL: r2dbc:postgresql://db:5432/qsp
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD}
      # iss claim must be the public URL; keys are fetched over the internal network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://${QSP_HOST}:${QSP_PORT}/auth
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://auth:9000/oauth2/jwks

  web:
    image: f4fez/qsp-web:${QSP_WEB_VERSION:-0.1.1}
    environment:
      QSP_HOST: ${QSP_HOST}
      QSP_PORT: ${QSP_PORT}
    volumes:
      - ./web/config.json.template:/templates/config.json.template:ro,z
      - ./web/render-config.sh:/docker-entrypoint.d/40-render-config.sh:ro,z

  proxy:
    image: nginx:1.27-alpine
    depends_on: [web, auth, signaling]
    ports:
      - "${QSP_PORT}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z

volumes:
  db-data:
