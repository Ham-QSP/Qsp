# One public origin: /auth -> auth server, /signaling -> signaling server
# (including the agent WebSocket), everything else -> web client.
server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Prefix /auth;

    location /auth/ {
        proxy_pass http://auth:9000/;
    }

    location /signaling/ {
        # Upgrade headers let /signaling/server/session become a WebSocket.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Forwarded-Prefix /signaling;
        proxy_read_timeout 1h;
        proxy_pass http://signaling:7080/;
    }

    location / {
        proxy_pass http://web:80/;
    }
}
