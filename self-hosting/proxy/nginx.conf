# One public origin: /auth -> auth server, /signaling -> signaling server
# (including the agent WebSocket), everything else -> web client.

# "Connection: upgrade" only for WebSocket requests, plain HTTP stays normal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    absolute_redirect off;   # keep redirects relative (the public port differs from 80)

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    # Upgrade/Connection are set at server level so every location inherits all
    # headers (nginx drops inherited headers once a location sets its own).
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location = /auth {
        return 301 /auth/;
    }

    location /auth/ {
        proxy_pass http://auth:9000/;
    }

    location /signaling/ {
        proxy_read_timeout 1h;   # keep agent WebSockets open
        proxy_pass http://signaling:7080/;
    }

    location / {
        proxy_pass http://web:80/;
    }
}
